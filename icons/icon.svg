<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="wall-tiles" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#3b34a8" stroke-width="4"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#3a35c9"/>
      <stop offset="1" stop-color="#14103a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect width="512" height="512" rx="112" fill="url(#wall-tiles)" opacity=".55"/>
  <g fill="#ff4fa3"><circle cx="92" cy="118" r="7"/><circle cx="430" cy="322" r="6"/><circle cx="118" cy="408" r="5"/></g>
  <g fill="#ece9ff"><circle cx="404" cy="96" r="5"/><circle cx="74" cy="262" r="4"/><circle cx="386" cy="436" r="5"/></g>
  <!-- hard offset shadow, then the station ring: a zero -->
  <ellipse cx="270" cy="272" rx="118" ry="150" fill="none" stroke="#05040f" stroke-width="76" opacity=".55"/>
  <ellipse cx="256" cy="256" rx="118" ry="150" fill="none" stroke="#05040f" stroke-width="76"/>
  <ellipse cx="256" cy="256" rx="118" ry="150" fill="none" stroke="#f7e733" stroke-width="50"/>
  <path d="M158 196a104 136 0 0 1 60-74" fill="none" stroke="#fffbd0" stroke-width="10" stroke-linecap="round"/>
  <!-- docking spine through the ring, with a ship's running light at the end -->
  <path d="M132 424 380 88" stroke="#05040f" stroke-width="54" stroke-linecap="round"/>
  <path d="M132 424 380 88" stroke="#2fd6c3" stroke-width="30" stroke-linecap="round"/>
  <circle cx="380" cy="88" r="26" fill="#ff5d47" stroke="#05040f" stroke-width="12"/>
</svg>
